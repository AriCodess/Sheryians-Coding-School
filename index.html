<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleX - Insights & Blogs</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <nav class="navbar">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12H12L8 4H4L4 12Z" fill="white" />
          <path d="M20 12H12L16 20H20L20 12Z" fill="white" />
        </svg>
      </div>
      <span class="logo-text">ScaleX</span>
    </div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Blogs</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>

    <a href="#" class="btn btn-outline">Get Started</a>
  </nav>

  <main class="container">

    <header class="hero">
      <h1 class="hero-title">Insights & Blogs</h1>
    </header>

    <div class="filters">
      <button class="filter-btn-active">All</button>
      <button class="filter-btn">Tech</button>
      <button class="filter-btn">SaaS</button>
      <button class="filter-btn">Marketing</button>
    </div>

    <div class="cards-layout">

      <article class="card">
        <div class="card-img-wrapper">
          <img
            src="images/Martini-glass-image.webp"
            alt="Martini Glass" class="card-img">
        </div>
        <div class="card-content">
          <span class="tag tag-tech">Tech</span>
          <h2 class="card-title">The Ultimate Guide To SaaS Marketing</h2>
          <p class="card-date">May 23, 2025</p>
        </div>
      </article>

      <article class="card">
        <div class="card-img-wrapper">
          <img src="images/Chair-image.png" alt="Green Chair" class="card-img">
        </div>
        <div class="card-content">
          <span class="tag tag-saas">SaaS</span>
          <h2 class="card-title">5 Key Trends In SaaS Growth For 2025</h2>
          <p class="card-date">May 23, 2025</p>
        </div>
      </article>

      <article class="card">
        <div class="card-img-wrapper">
          <img src="images/Cat-image.jpg" alt="Cat on Red Background" class="card-img">
        </div>
        <div class="card-content">
          <span class="tag tag-marketing">Marketing</span>
          <h2 class="card-title">How Data-Driven Strategies Are Important</h2>
          <p class="card-date">May 23, 2025</p>
        </div>
      </article>

    </div>
  </main>

</body>

</html>
